<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>WDkadai21</title>

    <style>
        body {
            margin: 0;
            padding: 15px;
        }

        h1 {
            margin: 0 0 40px 0;
        }

        h1 img {
            width: 750px;
            height: auto;
        }

        figure {

        }

            width: 265px;
            height: auto;
        }

            margin-top: 5px;
        }

</head>

<body>

    <h1>
        <img src="images/title.png" alt="墓地で暮らす猫たち。">
    </h1>

    <figure>
        <img src="images/photo.jpg" alt="墓地でくつろぐ猫">
        <figcaption>撮影：2017年12月1日（東京都台東区）</figcaption>
    </figure>

</html>
